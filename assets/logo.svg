<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PROJECT: PLAYTIME Downgrader">
  <defs>
    <radialGradient id="tlo" cx="50%" cy="34%" r="76%">
      <stop offset="0%"   stop-color="#40121A"/>
      <stop offset="52%"  stop-color="#1B0A0F"/>
      <stop offset="100%" stop-color="#0B0406"/>
    </radialGradient>

    <linearGradient id="maska" x1="26%" y1="0%" x2="74%" y2="100%">
      <stop offset="0%"   stop-color="#F45A54"/>
      <stop offset="42%"  stop-color="#D42E33"/>
      <stop offset="100%" stop-color="#84131C"/>
    </linearGradient>

    <linearGradient id="filtr" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%"   stop-color="#6FB4FF"/>
      <stop offset="48%"  stop-color="#2A6AD4"/>
      <stop offset="100%" stop-color="#123A85"/>
    </linearGradient>

    <linearGradient id="kanister" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFE07A"/>
      <stop offset="48%"  stop-color="#ECB524"/>
      <stop offset="100%" stop-color="#A9740A"/>
    </linearGradient>

    <radialGradient id="oko" cx="36%" cy="30%" r="82%">
      <stop offset="0%"   stop-color="#2E1519"/>
      <stop offset="42%"  stop-color="#100608"/>
      <stop offset="100%" stop-color="#040102"/>
    </radialGradient>

    <radialGradient id="poswiata" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF3B41" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#FF3B41" stop-opacity="0"/>
    </radialGradient>

    <filter id="cien" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="106" fill="url(#tlo)"/>
  <circle cx="256" cy="206" r="220" fill="url(#poswiata)"/>

  <!-- pasy ostrzegawcze - nawiązanie do hali fabryki -->
  <g opacity="0.05" fill="#FFD95C">
    <rect x="-120" y="392" width="760" height="26" transform="rotate(-24 256 400)"/>
    <rect x="-120" y="440" width="760" height="26" transform="rotate(-24 256 400)"/>
    <rect x="-120" y="488" width="760" height="26" transform="rotate(-24 256 400)"/>
  </g>

  <g filter="url(#cien)">
    <!-- kanistry: rysowane przed maską, aby korpus je nakrywał -->
    <g>
      <rect x="30"  y="312" width="134" height="84" rx="34" fill="url(#kanister)"/>
      <rect x="30"  y="312" width="134" height="84" rx="34" fill="none" stroke="#6E4A05" stroke-width="6" opacity="0.45"/>
      <rect x="48"  y="330" width="17"  height="48" rx="9"  fill="#FFF6CF" opacity="0.42"/>
      <rect x="136" y="322" width="10"  height="64" rx="5"  fill="#6E4A05" opacity="0.35"/>

      <rect x="348" y="312" width="134" height="84" rx="34" fill="url(#kanister)"/>
      <rect x="348" y="312" width="134" height="84" rx="34" fill="none" stroke="#6E4A05" stroke-width="6" opacity="0.45"/>
      <rect x="447" y="330" width="17"  height="48" rx="9"  fill="#FFF6CF" opacity="0.42"/>
      <rect x="368" y="322" width="10"  height="64" rx="5"  fill="#6E4A05" opacity="0.35"/>
    </g>

    <!-- korpus maski: szeroka czaszka zwężająca się ku dołowi -->
    <path d="M256 58
             C 358 58 420 128 420 222
             C 420 268 409 302 390 332
             C 373 359 351 380 327 394
             C 305 407 282 414 256 414
             C 230 414 207 407 185 394
             C 161 380 139 359 122 332
             C 103 302 92 268 92 222
             C 92 128 154 58 256 58 Z"
          fill="url(#maska)"/>

    <!-- refleks na czole -->
    <path d="M256 84
             C 328 84 382 128 396 192
             C 358 150 312 130 256 130
             C 200 130 154 150 116 192
             C 130 128 184 84 256 84 Z"
          fill="#FFFFFF" opacity="0.17"/>

    <!-- otwory oczu -->
    <g>
      <circle cx="186" cy="206" r="56" fill="url(#oko)"/>
      <circle cx="186" cy="206" r="56" fill="none" stroke="#71101A" stroke-width="8" opacity="0.85"/>
      <circle cx="167" cy="187" r="16" fill="#FFFFFF" opacity="0.12"/>

      <circle cx="326" cy="206" r="56" fill="url(#oko)"/>
      <circle cx="326" cy="206" r="56" fill="none" stroke="#71101A" stroke-width="8" opacity="0.85"/>
      <circle cx="307" cy="187" r="16" fill="#FFFFFF" opacity="0.12"/>
    </g>

    <!-- filtr centralny wysunięty poza obrys maski -->
    <g>
      <circle cx="256" cy="378" r="88" fill="#71101A" opacity="0.6"/>
      <circle cx="256" cy="378" r="80" fill="url(#filtr)"/>
      <circle cx="256" cy="378" r="60" fill="none" stroke="#0E2F6B" stroke-width="10" opacity="0.7"/>
      <circle cx="256" cy="378" r="40" fill="none" stroke="#0E2F6B" stroke-width="10" opacity="0.55"/>

      <!-- strzałka w dół: cofnięcie wersji -->
      <path d="M256 342 L256 396 M224 376 L256 408 L288 376"
            fill="none" stroke="#F2F8FF" stroke-width="18"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
